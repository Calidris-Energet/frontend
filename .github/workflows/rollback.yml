name: Rollback

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to revert (leave empty for last merged PR)'
        required: false
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  revert_pr:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@master

      - name: Get last merged PR
        id: get_pr
        run: |
          if [ -n "${{ github.event.inputs.pr_number }}" ]; then
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
          else
            # Get the last merged PR to main
            PR_NUMBER=$(gh pr list --state merged --base main --limit 1 --json number --jq '.[0].number')
          fi
          
          if [ -z "$PR_NUMBER" ]; then
            echo "No merged PR found to revert"
            exit 1
          fi
          
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "Will revert PR #$PR_NUMBER"

      - name: Create Revert PR
        id: create_revert
        run: |
          # Create revert PR
          gh pr create \
            --title "Revert PR #${{ steps.get_pr.outputs.pr_number }}" \
            --body "Auto-reverting PR #${{ steps.get_pr.outputs.pr_number }}" \
            --base main \
            --head revert-branch-${{ steps.get_pr.outputs.pr_number }} \
            --label revert
          
          # Get the revert PR number
          REVERT_PR=$(gh pr list --head revert-branch-${{ steps.get_pr.outputs.pr_number }} --json number --jq '.[0].number')
          echo "revert_pr_number=$REVERT_PR" >> $GITHUB_OUTPUT

      - name: Merge Revert PR
        run: |
          # Merge the revert PR
          gh pr merge ${{ steps.create_revert.outputs.revert_pr_number }} \
            --merge \
            --delete-branch \
            --subject "Merge revert PR #${{ steps.create_revert.outputs.revert_pr_number }}"
