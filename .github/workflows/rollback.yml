name: Rollback

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to revert (leave empty for last merged PR)'
        required: false
        type: number

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  revert_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@master
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Test token permissions
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh auth status
          gh repo view

      - name: Get last merged PR
        id: get_pr
        run: |
          if [ -n "${{ github.event.inputs.pr_number }}" ]; then
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
          else
            PR_NUMBER=$(gh pr list --state merged --base main --limit 1 --json number --jq '.[0].number')
          fi
          
          if [ -z "$PR_NUMBER" ]; then
            echo "No merged PR found to revert"
            exit 1
          fi
          
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "Will revert PR #$PR_NUMBER"

      - name: Create revert branch and PR
        id: create_revert
        run: |
          BRANCH_NAME="revert-branch-${{ steps.get_pr.outputs.pr_number }}-$(date +%s)"
          git checkout -b $BRANCH_NAME
          
          MERGE_COMMIT=$(gh pr view ${{ steps.get_pr.outputs.pr_number }} --json mergeCommit --jq '.mergeCommit.oid')
          
          echo "Merge commit: $MERGE_COMMIT"
          
          git revert -m 1 $MERGE_COMMIT --no-edit
          
          git push origin $BRANCH_NAME
          
          REVERT_PR_URL=$(gh pr create \
            --title "Revert PR #${{ steps.get_pr.outputs.pr_number }}" \
            --body "Auto-reverting PR #${{ steps.get_pr.outputs.pr_number }}" \
            --base main \
            --head $BRANCH_NAME \
            --label revert)
          
          REVERT_PR_NUMBER=$(echo $REVERT_PR_URL | grep -oE '[0-9]+$')
          echo "revert_pr_number=$REVERT_PR_NUMBER" >> $GITHUB_OUTPUT
          echo "Created revert PR #$REVERT_PR_NUMBER"

      - name: Merge Revert PR
        run: |
          gh pr merge ${{ steps.create_revert.outputs.revert_pr_number }} \
            --merge \
            --delete-branch
